version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Stack baseline is Spring Boot 4.1 (workspace ADR 0001/0002): only 4.1.x patches here.
      # Moving to 4.2 or later is a decision for an ADR, not a Dependabot PR.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
