name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: SonarQube Cloud uses it to tell new code from old code.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test (with JaCoCo coverage)
        run: mvn --batch-mode --no-transfer-progress verify
      # ADR 0011. Skipped until Alessio sets the SONAR_TOKEN secret and the SONAR_ORGANIZATION and
      # SONAR_PROJECT_KEY repository variables; always skipped on Dependabot PRs, which get no secrets.
      - name: SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_ORGANIZATION" ] || [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "::notice::SonarQube Cloud analysis skipped: SONAR_TOKEN, SONAR_ORGANIZATION or SONAR_PROJECT_KEY not set."
            exit 0
          fi
          mvn --batch-mode --no-transfer-progress org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY"
