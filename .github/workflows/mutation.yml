name: Mutation testing

# PIT changes the code on purpose and checks that some test fails (ADR 0011). A full run takes about
# 8 minutes, so it runs weekly and on demand instead of on every PR, to save the free CI minutes that the
# Hevy sync also needs (ADR 0010). The HTML report is attached to the run as an artifact.

on:
  schedule:
    - cron: '41 3 * * 1'  # Mondays 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Mutation testing (PIT)
        run: mvn --batch-mode --no-transfer-progress -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-report
          path: target/pit-reports/
          if-no-files-found: warn
